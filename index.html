<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARET NETWORK | Official Web3 Mining & Airdrop Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070d1b;
            --card-bg: rgba(17, 24, 39, 0.92);
            --card-border: rgba(56, 189, 248, 0.25);
            --primary-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --green-glow: rgba(34, 197, 94, 0.25);
            --bnb-yellow: #f0b90b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --warning-yellow: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
        }

        header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 15px; }
        .brand-title { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .btn-auth { background: rgba(37, 99, 235, 0.2); border: 1px solid var(--primary-blue); color: var(--accent-cyan); padding: 6px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }

        .container { width: 100%; max-width: 480px; }
        .auth-card, .section-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 24px; padding: 22px; text-align: center; margin-top: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(11, 19, 43, 0.7); color: white; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-cyan); }
        
        .btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, #2563eb, #06b6d4); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(37,99,235,0.4); }
        .btn-biometric { width: 100%; padding: 12px; background: rgba(6, 182, 212, 0.1); border: 1px solid var(--accent-cyan); border-radius: 12px; color: var(--accent-cyan); font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; }

        #app-dashboard { display: none; }
        
        .nav-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .nav-btn { background: rgba(17, 24, 39, 0.8); border: 1px solid var(--card-border); color: var(--text-muted); padding: 11px 6px; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 0.75rem; text-align: center; transition: all 0.2s ease; }
        .nav-btn:hover { border-color: var(--accent-cyan); color: white; }
        .nav-btn.active { background: linear-gradient(135deg, rgba(37,99,235,0.3), rgba(6,182,212,0.3)); border-color: var(--accent-cyan); color: white; box-shadow: 0 0 12px var(--accent-glow); }

        .rate-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(6, 182, 212, 0.1); border: 1px solid var(--card-border); color: var(--accent-cyan); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; margin-bottom: 12px; }
        
        .mining-circle { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(11,19,43,0.9) 75%); border: 3px solid var(--accent-cyan); box-shadow: 0 0 25px var(--accent-glow); margin: 12px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .mining-circle:active { transform: scale(0.96); }
        .mining-circle.active { border-color: #22c55e; box-shadow: 0 0 30px var(--green-glow); }

        .balance-box { background: rgba(11, 19, 43, 0.8); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-top: 15px; text-align: left; }
        .balance-amount { font-size: 1.6rem; font-weight: 800; color: var(--accent-cyan); margin-top: 4px; }
        
        .user-info { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(17, 24, 39, 0.5); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .badge-kyc { padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3px; }
        .kyc-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning-yellow); border: 1px solid rgba(245,158,11,0.3); }
        .kyc-verified { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .kyc-unverified { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .chain-badge { background: rgba(240, 185, 11, 0.1); border: 1px solid rgba(240,185,11,0.3); color: var(--bnb-yellow); font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .scan-scanner { width: 100%; height: 120px; border: 2px dashed var(--accent-cyan); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; background: rgba(6, 182, 212, 0.03); position: relative; overflow: hidden; }
        .ca-box { background: rgba(11, 19, 43, 0.8); border: 1px solid var(--bnb-yellow); padding: 10px; border-radius: 10px; font-size: 0.72rem; word-break: break-all; color: var(--bnb-yellow); margin: 10px 0; text-align: left; }

        /* MODAL WALLET PICKER */
        #wallet-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .wallet-modal-card { background: #111827; border: 1px solid var(--card-border); width: 90%; max-width: 360px; border-radius: 20px; padding: 20px; text-align: center; }
        .wallet-option { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; margin: 10px 0; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s; font-weight: 600; font-size: 0.9rem; text-align: left; }
        .wallet-option:hover { border-color: var(--accent-cyan); background: rgba(56,189,248,0.1); }
    </style>
</head>
